<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Inventario </title>
<style>
body{font-family:Arial;background:#0f172a;color:white;padding:20px}
input,button{padding:10px;margin:5px;border:none;border-radius:5px}
button{background:#38bdf8;color:black;cursor:pointer}
.card{background:#1e293b;padding:10px;margin:10px 0;border-radius:8px}
.top{display:flex;flex-wrap:wrap;gap:10px}
</style>
</head>
<body>

<h1>Sistema de Inventario </h1>

<div class="top">
<input type="text" id="nombre" placeholder="Nombre del producto">
<input type="number" id="cantidad" placeholder="Cantidad">
<button onclick="agregarProducto()">Agregar</button>
<input type="text" id="buscar" placeholder="Buscar" onkeyup="filtrar()">
</div>

<h3>Total productos: <span id="total">0</span></h3>

<div id="lista"></div>

<script>
let usuario = "1";
let password = "1";

let login = prompt("Usuario:");
let pass = prompt("Contraseña:");

if(login !== usuario || pass !== password){
    alert("Acceso denegado");
    document.body.innerHTML = "<h1>Acceso bloqueado</h1>";
}

let productos = JSON.parse(localStorage.getItem('productos')) || [];

function guardar(){
    localStorage.setItem('productos', JSON.stringify(productos));
}

function mostrar(listaFiltrada = productos){
    let lista = document.getElementById('lista');
    lista.innerHTML = '';

    document.getElementById('total').textContent = productos.length;
    
    listaFiltrada.forEach((p, index) => {
        lista.innerHTML += `
            <div class="card">
                <strong>${p.nombre}</strong> - Cantidad: ${p.cantidad}
                <br>
                <button onclick="editar(${index})">Editar</button>
                <button onclick="eliminar(${index})">Eliminar</button>
            </div>
        `;
    });
}

function agregarProducto(){
    let nombre = document.getElementById('nombre').value;
    let cantidad = document.getElementById('cantidad').value;

    if(nombre === '' || cantidad === ''){
        alert('Completa los datos');
        return;
    }

    productos.push({nombre, cantidad});
    guardar();
    mostrar();
}

function eliminar(index){
    productos.splice(index,1);
    guardar();
    mostrar();
}

function editar(index){
    let nuevoNombre = prompt("Nuevo nombre:", productos[index].nombre);
    let nuevaCantidad = prompt("Nueva cantidad:", productos[index].cantidad);

    if(nuevoNombre && nuevaCantidad){
        productos[index] = {nombre:nuevoNombre, cantidad:nuevaCantidad};
        guardar();
        mostrar();
    }
}

function filtrar(){
    let texto = document.getElementById('buscar').value.toLowerCase();
    let filtrados = productos.filter(p => p.nombre.toLowerCase().includes(texto));
    mostrar(filtrados);
}

mostrar();
</script>

</body>
</html>
